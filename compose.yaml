# .yaml built from Dockerfile
# help:
# https://docs.docker.com/go/compose-spec-reference/

# use .:/app user volume, so user of container has write permissions 
# command line run prompt (either): 
# >>> docker compose up --build
# >>> docker compose up --build service1 service2
# for code changes
# >>> docker compose restart service1 && docker compose restart service2

services:
  service1:
    build: .
    command: ['python', 'telegram_bot.py']
    container_name: telegram_bot
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv # anonymous volume: keeps the image's installed deps from being hidden by the bind mount above

  service2:
      build: .
      command: ['python', '-m', 'live_trading.run_live']
      container_name: strategy
      env_file:
        - .env
      ports:
        - "9000:9000"
      volumes:
        - .:/app
        - /app/.venv # anonymous volume: keeps the image's installed deps from being hidden by the bind mount above