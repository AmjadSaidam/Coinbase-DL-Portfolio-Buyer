# --- INFO ---
# .yaml built from Dockerfile for project containerisation 
# help:
# https://docs.docker.com/go/compose-spec-reference/

# command line run prompt (either), run only for DockerFile/.yaml changes, -d ensures runs in backround not current terminal: 
# >>> docker compose up --build -d
# >>> docker compose up --build -d service1 service2

# for code changes (last for both):
# >>> docker compose up -d service1
# >>> docker compose up -d service2
# >>> docker compose up -d service1 service2

# --- DOCKERFILE IMAGES LOGIC ---
services:
  service1:
    build:
      context: .
      # matches the appuser uid/gid to the host user so writes to bind-mounted, host-owned files
      # (shut_down_state.json etc.) don't hit sqlite3.OperationalError: attempt to write a readonly
      # database; HOST_UID/HOST_GID come from .env (defaults here are this machine's `id -u`/`id -g`)
      args:
        UID: ${HOST_UID:-501}
        GID: ${HOST_GID:-20}
    command: ['python', 'telegram_bot.py']
    container_name: telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app # .:/app user volume, so user of container has write permissions
      - /app/.venv # anonymous volume: keeps the image's installed deps from being hidden by the bind mount above

  service2:
      build:
        context: .
        args:
          UID: ${HOST_UID:-501}
          GID: ${HOST_GID:-20}
      command: ['python', '-m', 'live_trading.live_loop']
      container_name: strategy
      restart: unless-stopped
      env_file:
        - .env
      ports:
        - "9000:9000"
      volumes:
        - .:/app
        - /app/.venv